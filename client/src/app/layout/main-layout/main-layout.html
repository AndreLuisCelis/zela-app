<div class="min-h-screen bg-slate-50 flex flex-col pb-32">
  <!-- Header global com identificação do usuário -->
  <app-header (loginClick)="uiStore.openAuth()" />

  <!-- Conteúdo da rota ativa -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Rodapé global (bottom tab bar) -->
  <nav
    class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-100 px-8 py-4 flex items-center justify-between z-40">
    <button (click)="activeTab.set('home')"
      [class]="'p-2 transition-colors ' + (activeTab() === 'home' ? 'text-navy-900' : 'text-slate-300')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="2.5"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
    </button>

    <!-- Central FAB -->
    <button (click)="openCreateReport()"
      class="w-14 h-14 bg-navy-900 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-navy-900/20 -mt-10 border-4 border-white active:scale-90 transition-transform hover:bg-navy-800">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="3" d="M12 4v16m8-8H4" />
      </svg>
    </button>

    <button (click)="activeTab.set('profile')"
      [class]="'p-2 transition-colors ' + (activeTab() === 'profile' ? 'text-navy-900' : 'text-slate-300')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </button>
  </nav>

  <!-- Modal global: novo alerta -->
  @if (uiStore.showCreateReport()) {
  <app-create-report (close)="uiStore.closeCreateReport()" (success)="handleReportSuccess($event)" />
  }

  <!-- Modal global: autenticação -->
  @if (uiStore.showAuth()) {
  <div class="fixed inset-0 bg-navy-950/40 backdrop-blur-sm z-[60] flex items-center justify-center p-6">
    <div class="relative w-full max-w-sm">
      <button (click)="uiStore.closeAuth()"
        class="absolute -top-3 -right-3 z-10 bg-white rounded-full p-2 shadow-lg text-slate-400 hover:text-red-500 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="bg-white rounded-3xl overflow-hidden shadow-2xl">
        <app-auth (success)="uiStore.closeAuth()"></app-auth>
      </div>
    </div>
  </div>
  }
</div>
