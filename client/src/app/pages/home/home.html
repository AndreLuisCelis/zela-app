<div class="min-h-screen bg-slate-50">
  <main class="p-6 max-w-2xl mx-auto w-full">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-extrabold text-navy-900 tracking-tight">Ocorrências Ativas</h2>
      <div class="flex items-center gap-1.5">
        <div class="w-2 h-2 rounded-full bg-navy-600 animate-pulse"></div>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">ao vivo</span>
      </div>
    </div>

    @if (zelaService.isLoading()) {
      <!-- Skeleton Loaders -->
      @for (i of [1, 2, 3]; track i) {
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-5 animate-pulse">
        <div class="flex items-center gap-3 mb-4">
          <div class="h-5 bg-slate-200 rounded-full w-20"></div>
          <div class="flex-1"></div>
          <div class="h-4 bg-slate-200 rounded w-16"></div>
        </div>
        <div class="h-5 bg-slate-200 rounded w-3/4 mb-3"></div>
        <div class="h-48 rounded-2xl bg-slate-200 mb-4"></div>
        <div class="h-4 bg-slate-200 rounded w-full mb-2"></div>
        <div class="h-4 bg-slate-200 rounded w-2/3"></div>
      </div>
      }
    } @else {
      @for (report of zelaService.reports(); track report._id) {
      <app-report-card class="block mb-5" [report]="report" (selectReport)="openReportDetail($event)"></app-report-card>
      }
    }
  </main>
</div>

<!-- Modais de Ação da Home -->
@if (showSponsorModal()) {
<app-sponsor-modal (close)="showSponsorModal.set(false)" (success)="handleSponsorSuccess($event)" />
}

@if (showSolveModal()) {
<app-solve-modal (close)="showSolveModal.set(false)" (success)="confirmSolve($event)" />
}

@if (showNoticeModal()) {
<app-notice-modal 
  [title]="noticeData().title" 
  [message]="noticeData().message" 
  [type]="noticeData().type"
  [buttonText]="noticeData().buttonText || 'Entendi'"
  [actionButtonText]="noticeData().actionButtonText"
  (action)="handleNoticeAction()"
  (close)="showNoticeModal.set(false)" />
}
