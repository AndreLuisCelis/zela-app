<div class="fixed inset-0 z-[110] flex items-center justify-center p-6 bg-navy-950/40 backdrop-blur-sm animate-in fade-in duration-300">
  <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl animate-in zoom-in-95 duration-300 flex flex-col items-center text-center border border-slate-100">
    
    <!-- Icon Container -->
    <div [class]="'w-20 h-20 rounded-2xl flex items-center justify-center text-4xl shadow-sm mb-6 transform hover:scale-105 transition-transform duration-300 border ' + colorClass">
      <div class="italic font-black">{{ icon }}</div>
    </div>

    <!-- Content -->
    <h2 class="text-2xl font-extrabold text-navy-900 uppercase tracking-tight mb-2">
      {{ title() }}
    </h2>
    
    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest leading-relaxed mb-8 max-w-[220px]">
      {{ message() }}
    </p>

    <!-- Actions -->
    <div class="w-full flex flex-col gap-3">
      @if (actionButtonText()) {
      <button
        (click)="action.emit()"
        [class]="'w-full py-4 bg-transparent border-2 font-extrabold rounded-full uppercase tracking-widest active:scale-95 transition-all text-xs ' + (type() === 'error' ? 'border-red-100 text-red-600 hover:bg-red-50' : 'border-navy-100 text-navy-900 hover:bg-navy-50')">
        {{ actionButtonText() }}
      </button>
      }
      <button
        (click)="close.emit()"
        [class]="'w-full py-4 text-white font-extrabold rounded-full uppercase tracking-widest shadow-lg active:scale-95 transition-all text-xs ' + buttonClass">
        {{ buttonText() }}
      </button>
    </div>
  </div>
</div>
