<div (click)="close.emit()"
    class="fixed inset-0 bg-navy-950/40 backdrop-blur-sm z-[60] flex items-center justify-center p-6 animate-in fade-in zoom-in duration-200">
    <div (click)="$event.stopPropagation()" class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative overflow-hidden">

        <!-- Background Decoration -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-navy-50 rounded-bl-[100%] -z-0 pointer-events-none"></div>

        <!-- Botão Fechar -->
        <button (click)="close.emit()"
            class="absolute top-6 right-6 z-20 text-slate-400 hover:text-navy-900 bg-white/50 hover:bg-slate-50 rounded-full p-2 transition-all shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <div class="relative z-10">
            <div
                class="w-16 h-16 bg-navy-50 rounded-2xl flex items-center justify-center mb-6 text-3xl shadow-sm border border-navy-100">
                🤝
            </div>

            <h3 class="text-2xl font-extrabold text-navy-900 uppercase tracking-tight mb-1">Aceitar Missão</h3>
            <p class="text-xs text-slate-500 mb-6 font-medium">Como você pretende resolver este problema?</p>

            <div class="space-y-4">
                <!-- Plano de Ação -->
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Seu Plano
                        de Ação</label>
                    <textarea [(ngModel)]="plan" rows="3" placeholder="Descreva brevemente o que vai fazer..."
                        class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-navy-200 focus:bg-white rounded-2xl font-medium text-sm outline-none transition-all resize-none text-slate-700 placeholder:text-slate-300"></textarea>
                </div>

                <!-- Upload de Imagens -->
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">
                        Fotos (Opcional)
                        <span class="text-navy-500 ml-1 cursor-pointer hover:underline" (click)="fileInput.click()">+
                            Adicionar</span>
                    </label>
                    <input #fileInput type="file" multiple accept="image/*" class="hidden"
                        (change)="onFileSelected($event)">

                    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                        <!-- Botão Placeholder se vazio -->
                        @if (previews().length === 0) {
                        <div (click)="fileInput.click()"
                            class="w-20 h-20 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 flex items-center justify-center text-slate-300 cursor-pointer hover:border-navy-300 hover:text-navy-300 transition-colors shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        }

                        @for (preview of previews(); track $index) {
                        <div class="relative w-20 h-20 rounded-2xl overflow-hidden shadow-sm shrink-0 group border border-slate-100">
                            <img [src]="preview" class="w-full h-full object-cover">
                            <button (click)="removeImage($index)"
                                class="absolute top-1 right-1 bg-red-500/90 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        }
                    </div>
                </div>

                <!-- Botões -->
                <div class="flex flex-col gap-3 mt-6">
                    <button (click)="submit()" [disabled]="!plan()"
                        class="w-full py-4 bg-navy-900 disabled:bg-slate-100 disabled:text-slate-400 text-white font-extrabold rounded-full uppercase text-xs tracking-widest active:scale-95 transition-all shadow-lg shadow-navy-900/20 disabled:shadow-none hover:bg-navy-800">
                        Confirmar Missão
                    </button>
                    <button (click)="close.emit()"
                        class="w-full py-4 bg-transparent text-slate-400 font-bold rounded-full uppercase text-[10px] tracking-widest hover:text-navy-900 hover:bg-slate-50 transition-colors">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
